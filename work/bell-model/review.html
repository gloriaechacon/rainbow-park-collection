<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bell · revisión 3D</title><style>body{margin:0;background:#edf0e7;font:14px sans-serif}#view{height:100vh}nav{position:fixed;z-index:2;top:20px;left:20px;background:#ffffffdd;border-radius:10px;padding:12px;display:flex;gap:8px;align-items:center}button{padding:10px;border:1px solid #afb7a9;background:white;border-radius:5px;cursor:pointer}canvas{width:100%;height:100%}p{position:fixed;bottom:15px;left:20px;color:#385045;background:#ffffffd9;padding:12px}</style><nav><strong>Bell</strong><button data-view="exterior">Fachada</button><button data-view="cutaway">Planta 3D</button><button data-view="living">Sala</button><button data-view="kitchen">Cocina</button><button data-view="master">Principal</button><button data-view="bedroom2">Dormitorio 2</button></nav><div id="view"></div><p id="state">Cargando Bell…</p><script type="module">
import * as T from '../vendor/three.module.js';import{loadHouse,daylight}from'../utah/model-loader.js';
const host=document.querySelector('#view'),r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));host.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#e0e7dc');const c=new T.PerspectiveCamera(40,1,.05,200);s.add(new T.HemisphereLight(0xe9f3ff,0xadb69c,.75));const sun=new T.DirectionalLight(0xfff4dc,2.5);sun.position.set(-9,20,16);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:65});sun.shadow.bias=-.00015;s.add(sun);const plane=new T.Mesh(new T.PlaneGeometry(90,90),new T.MeshStandardMaterial({color:'#bcc5a9',roughness:1}));plane.rotation.x=-Math.PI/2;plane.position.y=-.09;plane.receiveShadow=true;s.add(plane);daylight(s,r);r.toneMappingExposure=1.10;
const house=await loadHouse('bell.glb?v=2');s.add(house);const ambient=new T.AmbientLight(0xffffff,.20);s.add(ambient);let view='exterior';
const shots={exterior:{position:[3.8,5.2,23],target:[0,1.8,0],fov:40},cutaway:{position:[0,23,10],target:[0,0,-.5],fov:40},living:{position:[-2.00,1.60,2.10],target:[-.15,1.35,-3.25],fov:72},kitchen:{position:[-1.08,1.60,-2.50],target:[2.0,1.35,-4.70],fov:72},master:{position:[.82,1.60,3.18],target:[2.05,.85,1.40],fov:72},bedroom2:{position:[-4.80,1.60,-2.78],target:[-5.74,1.1,-4.1],fov:72}};
function draw(){let t=shots[view];c.position.fromArray(t.position);c.lookAt(...t.target);c.fov=t.fov;c.updateProjectionMatrix();r.render(s,c)}function size(){r.setSize(host.clientWidth,host.clientHeight,false);c.aspect=host.clientWidth/host.clientHeight;draw()}new ResizeObserver(size).observe(host);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;house.children.filter(n=>n.userData.roof).forEach(n=>n.visible=view!=='cutaway');document.querySelector('#state').textContent=view+' · Reconstrucción de la lámina arquitectónica · Acabados y mobiliario propuestos';draw()};document.querySelector('[data-view=exterior]').click();size();
</script></html>
