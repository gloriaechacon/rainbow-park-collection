<!doctype html><html><meta charset="utf-8"><title>Utah architectural model review</title><style>body{margin:0;background:#eae8df;font-family:Arial}canvas{display:block}nav{position:fixed;top:12px;left:12px;display:flex;gap:8px}button{padding:10px;background:#fff;border:1px solid #ccc;cursor:pointer}#status{position:fixed;bottom:10px;left:15px}</style><nav><button data-view="exterior">Fachada</button><button data-view="plan">Planta 3D</button><button data-view="living">Sala</button><button data-view="kitchen">Cocina</button><button data-view="primary">Dormitorio</button><button data-view="annex">Anexo</button></nav><div id="status">Loading...</div><script type="module">
import * as T from '../vendor/three.module.js';import {loadHouse,daylight} from './model-loader.js';
const scene=new T.Scene();scene.background=new T.Color('#eae8df');const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(r.domElement);daylight(scene,r);
const cam=new T.PerspectiveCamera(42,innerWidth/innerHeight,.05,200);const ambient=new T.HemisphereLight(0xffffff,0x888472,2.4);scene.add(ambient);const sun=new T.DirectionalLight(0xffedd5,3);sun.position.set(-8,16,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;scene.add(sun);
const model=await loadHouse('./utah-plan-v3.glb');scene.add(model);const ground=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:0xe4e1d6,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-.17;ground.receiveShadow=true;scene.add(ground);
const meta=await fetch('./metadata-plan-v3.json').then(r=>r.json());function set(k){const v=meta.cameras[k];cam.fov=['exterior','plan'].includes(k)?42:68;cam.position.fromArray(v.position);cam.up.set(0,1,0);cam.lookAt(new T.Vector3(...v.target));cam.updateProjectionMatrix();for(const n of model.children)if(n.userData.roof)n.visible=k!=='plan';document.querySelector('#status').textContent='Ready · '+k; r.render(scene,cam)}for(const b of document.querySelectorAll('button'))b.onclick=()=>set(b.dataset.view);set('exterior');window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);r.render(scene,cam)});
</script></html>
